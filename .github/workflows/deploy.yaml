name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Rust (stable)
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
          # rust-pack reads the source of std/core/alloc out of the sysroot
          rustc --print sysroot

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ra-wasm
            rust-pack
            vendor/rust-analyzer

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli

      - name: Generate fake sysroot
        working-directory: rust-pack
        run: cargo run --release

      - name: Build wasm (release)
        working-directory: ra-wasm
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir pkg --out-name wasm_demo \
            target/wasm32-unknown-unknown/release/wasm_demo.wasm

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build site
        working-directory: www
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        run: |
          touch www/dist/.nojekyll
          cd www/dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -fq origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
