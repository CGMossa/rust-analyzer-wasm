name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Rust (stable)
        run: |
          rustup update stable
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ra-wasm
            rust-pack
            vendor/rust-analyzer

      - name: Install wasm-bindgen-cli, just, binaryen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli,just,binaryen

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust wasm target + rust-src
        run: just setup

      - name: Apply wasm patches
        run: just prepare

      - name: Build sysroot, wasm, and web bundle
        run: just sysroot wasm wasm-opt deps web

      - name: Headless smoke test
        run: just smoke

      - name: Deploy to gh-pages branch
        run: |
          touch www/dist/.nojekyll
          cd www/dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -fq origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
